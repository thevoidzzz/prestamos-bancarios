server:
  port: 18473

spring:
  application:
    name: prestamos-bancarios
  # Tomcat + Security servlet. WebFlux queda en el classpath para devolver Mono en lecturas.
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:h2:mem:prestamos;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60s

app:
  jwt:
    # En un ambiente real esto sale de una variable de entorno / secret manager
    secret: "makers-prestamos-clave-super-larga-para-hs256-2026-ok"
    expiration-ms: 28800000
  cors:
    origins: http://127.0.0.1:14209,http://localhost:14209
